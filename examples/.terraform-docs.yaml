formatter: "markdown document"

header-from: "_header.md"

content: |-
  <!-- Code generated by terraform-docs. DO NOT EDIT. -->
  {{ .Header }}

  ```hcl
  {{ include "main.tf" }}
  ```

output:
  file: README.md
  mode: replace
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

sort:
  enabled: false

settings:
  html: true
  indent: 2
